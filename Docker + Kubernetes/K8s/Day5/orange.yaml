apiVersion: apps/v1
kind: Deployment
metadata:
  name: orange-deployment
  labels:
    app: orange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orange
  template:
    metadata:
      labels:
        app: orange
    spec:
      containers:
        - name: orange-container
          image: hashicorp/http-echo
          args:
            - "-text=orange"
            - "-listen=:5678"
          ports:
            - containerPort: 5678

        - name: memory-load-generator
          image: python:3.10-slim
          command: ["python", "-c"]
          args:
            - |
              import time
              def fib(n):
                  a, b = 0, 1
                  seq = []
                  for _ in range(n):
                      seq.append(b)
                      a, b = b, a + b
                  return seq
                
              # Continuously generate Fibonacci sequence and keep in memory
              mem_holder = []
              while True:
                  mem_holder.extend(fib(10000))
                  time.sleep(1)
---
apiVersion: v1
kind: Service
metadata:
  name: orange-service
spec:
  selector:
    app: orange
  ports:
    - port: 5678
      targetPort: 5678
  type: ClusterIP
