apiVersion: v1
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        location / {
            return 200 '<!DOCTYPE html>
    <html>
    <head>
        <title>CloudCorp Sensitive App</title>
    </head>
    <body>
        <h1>Welcome to CloudCorp Sensitive Application</h1>
        <p>This is a restricted access application for internal use only.</p>
        <p>Debugging information:</p>
        <ul>
            <li>Application Status: Running</li>
            <li>Last Updated: 2024-01-15</li>
            <li>Environment: Production</li>
        </ul>
        <div style="display:none;">
            <p>Hidden Token: Check /etc/flag/flag file</p>
        </div>
        <p>Challenge 5 Complete!</p>
    </body>
    </html>';
            add_header Content-Type text/html;
        }
    }
