stages:
- stage: DeployDev
  jobs:
  - deployment: DevDeploy
    environment: 'dev'      
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              if [ "$(environment.name)" = "dev" ]; then
                echo "Deploying to DEV - Quick tests only"
              else
                echo "Deploying to $(environment.name) - Full validation"
              fi
            displayName: 'Environment check'

- stage: DeployProd  
  jobs:
  - deployment: ProdDeploy
    environment: 'prod'     
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              if [ "$(environment.name)" = "dev" ]; then
                echo "Deploying to DEV - Quick tests only"
              else
                echo "Deploying to $(environment.name) - Full validation"
              fi
            displayName: 'Environment check'
