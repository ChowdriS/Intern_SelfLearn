trigger: none
pr: none

resources:
  pipelines:
  - pipeline: planPipeline
    source: personalProject     
    trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  AZURE_SERVICE_CONNECTION: 'azure-sc'

steps:

- download: planPipeline
  artifact: tfplan-artifact
  displayName: "Download Terraform plan"

- task: TerraformInstaller@1
  inputs:
    terraformVersion: '1.5.0'

- task: AzureCLI@2
  displayName: 'Azure Login'
  inputs:
    azureSubscription: $(AZURE_SERVICE_CONNECTION)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      terraform init
      terraform apply -auto-approve "$(Pipeline.Workspace)/planPipeline/tfplan-artifact/tfplan"
