version: '3.9'
services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_logs:/var/log/nginx
    ports:
      - "8080:80"
    depends_on:
      - flask
    networks:
      - public
      - private
    restart: always

  flask:
    build: ./app
    environment:
      - DB_NAME=exampledb
      - DB_USER=exampleuser
      - DB_PASSWORD=examplepass
      - DB_ROOT_PASSWORD=exampleroot
    depends_on:
      - db
    networks:
      - private


  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=exampledb
      - MYSQL_USER=exampleuser
      - MYSQL_PASSWORD=examplepass
      - MYSQL_ROOT_PASSWORD=exampleroot
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - private
      
volumes:
  nginx_logs:
  db_data:

networks:
  public:
  private:
